<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 더세온연구소</title>
    <link rel="icon" href="/logo.jpg" type="image/jpeg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f7f8fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 480px;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #1a3e72;
            line-height: 1;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .error-desc {
            color: #777;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1a3e72;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .home-btn:hover { background: #2b5a9e; }
        .logo-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="/logo.jpg" alt="더세온연구소" class="logo-small">
        <div class="error-code">404</div>
        <div class="error-title">페이지를 찾을 수 없습니다</div>
        <div class="error-desc">
            요청하신 페이지가 존재하지 않거나 이동되었습니다<br>
            주소를 다시 확인해 주세요
        </div>
        <a href="/" class="home-btn">메인 페이지로 돌아가기</a>
    </div>
</body>
</html>
